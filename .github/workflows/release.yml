name: Release

# Builds the Arkived desktop installers for every OS and processor and publishes
# them to a GitHub Release. Run manually (workflow_dispatch) or by pushing a tag
# like `app-v0.0.1`; tauri-action reads the version from the app and creates the
# release `app-v<version>` with all installers attached.

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (universal)
            platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - label: Linux (x86_64)
            platform: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            args: ""
          - label: Linux (aarch64)
            platform: ubuntu-22.04-arm
            rust_targets: aarch64-unknown-linux-gnu
            args: ""
          - label: Windows (x64)
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: ""
          - label: Windows (ARM64)
            platform: windows-latest
            rust_targets: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file \
            libssl-dev \
            libxdo-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./app/src-tauri -> target
          key: ${{ matrix.label }}

      - name: Install frontend dependencies
        working-directory: ./app
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./app
          tagName: app-v__VERSION__
          releaseName: "Arkived v__VERSION__"
          releaseBody: |
            Desktop installers for Arkived. Download the file for your platform:

            - **Windows x64** — `*_x64-setup.exe` (NSIS) or `*_x64_en-US.msi`
            - **Windows ARM64** — `*_arm64-setup.exe`
            - **macOS (Intel + Apple Silicon)** — `*_universal.dmg`
            - **Linux x86_64** — `*_amd64.AppImage`, `*_amd64.deb`, or `*.x86_64.rpm`
            - **Linux aarch64** — `*_aarch64.AppImage`, `*_arm64.deb`, or `*.aarch64.rpm`
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
